name: Build Engine Plugins

# 内核插件（Servo / GeckoView）独立构建、独立发布，与主应用互不影响。
# 产物发布到固定标签 `engine-plugins` 的 Release（滚动覆盖，标记为 pre-release，不会抢占主应用的 "latest"），
# 主应用默认从 https://github.com/<repo>/releases/download/engine-plugins/<name>.apk 下载。
on:
  push:
    branches: [main]
    paths:
      - "gecko-engine-plugin/**"
      - "servo-engine-plugin/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "构建后发布到 engine-plugins Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: engine-plugins
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gecko
            module: gecko-engine-plugin
            apk: gecko-engine.apk
          - name: servo
            module: servo-engine-plugin
            apk: servo-engine.apk
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      # Gecko 的 Kotlin 编译器依赖偶发下载失败，预热并重试
      - name: Warm up Kotlin compiler dependencies
        if: matrix.name == 'gecko'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/warm-kotlin-deps.init.gradle" <<'GRADLE_INIT'
          gradle.projectsEvaluated {
              def p = gradle.rootProject.findProject(":gecko-engine-plugin")
              if (p == null) throw new GradleException("Project :gecko-engine-plugin was not found")
              p.tasks.register("warmKotlinCompilerDependencies") {
                  doLast {
                      def c = p.configurations.findByName("kotlinBuildToolsApiClasspath")
                      if (c == null) throw new GradleException("Configuration kotlinBuildToolsApiClasspath was not found")
                      c.resolve()
                  }
              }
          }
          GRADLE_INIT
          for attempt in 1 2 3; do
            if gradle -I "$RUNNER_TEMP/warm-kotlin-deps.init.gradle" \
                :gecko-engine-plugin:warmKotlinCompilerDependencies --no-daemon --stacktrace; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "ERROR: could not download Kotlin compiler dependencies"; exit 1

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > mula-release.jks
          test -s mula-release.jks

      - name: Build ${{ matrix.name }} plugin
        env:
          MULA_KEYSTORE: ${{ env.KEYSTORE_BASE64 != '' && 'mula-release.jks' || '' }}
          MULA_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          MULA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MULA_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :${{ matrix.module }}:assembleRelease --no-daemon --stacktrace

          SRC=$(find ${{ matrix.module }}/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -s "$SRC"
          mkdir -p dist
          cp "$SRC" dist/${{ matrix.apk }}

      # 必须带签名：未签名 APK 会 INSTALL_PARSE_FAILED_NO_CERTIFICATES
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs dist/${{ matrix.apk }}
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，插件使用 debug 签名（可安装，但与正式签名不同）"
          fi

      - name: Checksum and size report
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ${{ matrix.apk }} > ${{ matrix.apk }}.sha256
          ls -lah
          echo "### ${{ matrix.apk }}" >> "$GITHUB_STEP_SUMMARY"
          echo "size: $(du -h ${{ matrix.apk }} | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          unzip -l ${{ matrix.apk }} | grep -E '\.so$' >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lah dist

      - name: Publish engine-plugins release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-plugins
          name: Engine Plugins (Servo / GeckoView)
          body: |
            Mula 内核插件（滚动更新，固定标签 `engine-plugins`）。
            主应用会自动从此处下载 `gecko-engine.apk` / `servo-engine.apk` 及对应 `.sha256`。
          prerelease: true
          make_latest: "false"
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
