name: Build & Release Mula

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Install Android SDK
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Warm up Gecko Kotlin compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/warm-kotlin-deps.init.gradle" <<'GRADLE_INIT'
          gradle.projectsEvaluated {
              def gecko = gradle.rootProject.findProject(":gecko-engine-plugin")
              if (gecko == null) {
                  throw new GradleException("Project :gecko-engine-plugin was not found")
              }
              gecko.tasks.register("warmKotlinCompilerDependencies") {
                  group = "build setup"
                  doLast {
                      def configuration = gecko.configurations.findByName("kotlinBuildToolsApiClasspath")
                      if (configuration == null) {
                          throw new GradleException("Configuration kotlinBuildToolsApiClasspath was not found")
                      }
                      println("Pre-downloading ${configuration.name}...")
                      configuration.resolve()
                      println("Kotlin compiler dependencies are cached.")
                  }
              }
          }
          GRADLE_INIT

          for attempt in 1 2 3; do
            echo "Kotlin dependency warm-up attempt ${attempt}/3"
            if gradle -I "$RUNNER_TEMP/warm-kotlin-deps.init.gradle" \
                :gecko-engine-plugin:warmKotlinCompilerDependencies \
                --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Warm-up failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "ERROR: Could not download Gecko Kotlin compiler dependencies after 3 attempts."
          exit 1

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mula-release.jks
          test -s mula-release.jks

      - name: Build Servo plugin
        run: |
          set -e
          gradle :servo-engine-plugin:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          PLUGIN=$(find servo-engine-plugin/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$PLUGIN"
          test -s "$PLUGIN"
          cp "$PLUGIN" dist/servo-engine.apk
          cd dist
          sha256sum servo-engine.apk > servo-engine.apk.sha256
          cd ..

      - name: Build GeckoView plugin
        run: |
          set -e
          gradle :gecko-engine-plugin:assembleRelease --no-daemon --stacktrace
          PLUGIN=$(find gecko-engine-plugin/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$PLUGIN"
          test -s "$PLUGIN"
          cp "$PLUGIN" dist/gecko-engine.apk
          cd dist
          sha256sum gecko-engine.apk > gecko-engine.apk.sha256
          cd ..

      - name: Build Mula release
        if: env.KEYSTORE_BASE64 != ''
        env:
          MULA_KEYSTORE: mula-release.jks
          MULA_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          MULA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MULA_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          gradle :app:assembleRelease --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/mula.apk

      - name: Build Mula debug
        if: env.KEYSTORE_BASE64 == ''
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/mula-debug.apk

      - name: Verify release files
        run: |
          set -e
          echo "========== Release files =========="
          ls -lah dist/
          test -s dist/servo-engine.apk
          test -s dist/servo-engine.apk.sha256
          test -s dist/gecko-engine.apk
          test -s dist/gecko-engine.apk.sha256
          if [ -f dist/mula.apk ]; then
            test -s dist/mula.apk
          elif [ -f dist/mula-debug.apk ]; then
            test -s dist/mula-debug.apk
          else
            echo "ERROR: Mula APK missing"
            exit 1
          fi
          sha256sum -c dist/servo-engine.apk.sha256
          sha256sum -c dist/gecko-engine.apk.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mula-build-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mula ${{ github.ref_name }}
          files: |
            dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
